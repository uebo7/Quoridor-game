
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quoridor-game"
version = "0.1.0"
description = "A Quoridor board game built with Pygame"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
quoridor = "game.main:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["game*", "ui*", "utils*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
